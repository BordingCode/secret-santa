# Secret Santa wishlists Worker.
# Deploy: source ~/.cloudflare-token && cd worker && npx wrangler@3 deploy
# Table setup (once): npx wrangler@3 d1 execute secret-santa-wishes --remote --file schema.sql
# (wrangler 4 needs a newer Node than the Pi has)
name = "secret-santa-wishes"
main = "index.js"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "secret-santa-wishes"
database_id = "dd426253-f0e3-439f-88d6-fdf770c02d77"
